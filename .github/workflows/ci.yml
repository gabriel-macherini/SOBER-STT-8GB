name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check runner.mjs
      - run: node --check lib/stt.js
      - run: node --check tools/check-version.mjs
      - run: node -e "for (const f of ['config.json','installer/downloads.json','package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - run: node tools/check-version.mjs
      - run: node --test test/units.test.mjs
