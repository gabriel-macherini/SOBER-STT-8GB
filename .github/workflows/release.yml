name: release
# Tag-driven release: `git tag -a vX.Y.Z && git push origin vX.Y.Z`
# builds the portable + installer and publishes them on the GitHub release.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      # Ahk2Exe is not inside the v2 zip (and the choco package layout is not
      # stable), so assemble the standard install layout ourselves and point
      # build-portable.ps1 at it with AHK_DIR.
      - name: Install AutoHotkey v2 + Ahk2Exe
        shell: pwsh
        run: |
          $ahkVer = "2.0.30"
          $exe2Exe = "1.1.37.02a2"
          $dir = Join-Path $env:RUNNER_TEMP "ahk"
          New-Item -ItemType Directory -Force "$dir\v2", "$dir\Compiler" | Out-Null
          Invoke-WebRequest "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$ahkVer/AutoHotkey_$ahkVer.zip" -OutFile "$dir\v2.zip"
          Expand-Archive "$dir\v2.zip" -DestinationPath "$dir\v2" -Force
          Invoke-WebRequest "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe$exe2Exe/Ahk2Exe$exe2Exe.zip" -OutFile "$dir\ahk2exe.zip"
          Expand-Archive "$dir\ahk2exe.zip" -DestinationPath "$dir\Compiler" -Force
          "AHK_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: choco install innosetup -y
      - run: pwsh tools/build-portable.ps1
      - run: pwsh tools/build-installer.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          $exe = "dist/SOBER-STT-Setup-$ver.exe"
          if (!(Test-Path $exe)) { throw "missing $exe (version.txt vs tag mismatch?)" }
          $notes = ".cache/release-notes.md"
          New-Item -ItemType Directory -Force .cache | Out-Null
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($ver))\].*?(?=^## \[|\z)")
          ($m.Success ? $m.Value.Trim() : "Release $tag") | Set-Content $notes -Encoding UTF8NoBOM
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Add-Content $notes ""
          Add-Content $notes "SHA-256: $sha"
          gh release create $tag $exe --title $tag --notes-file $notes
